<!DOCTYPE html>
 <html>
   <head>
      <meta name="viewport"
         content="width=device-width, initial-scale=1">

         <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css">

      <title>Registrar's Office Class Search</title>

      </head>
   <body>
      <div class="container-fluid" style="background-color:#295078; color:white;">
         <center>
            <h1>Registrar's Office: Class Search</h1>
         </center>

         <div class="row">
            <div class="col-sm-3">
               <input class="form-control" type="text" placeholder="Department" id="deptInput" autoFocus>
            </div>

            <div class="col-sm-3">
               <input class="form-control" type="text" placeholder="Number" id="numInput" autoFocus>
            </div>

            <div class="col-sm-3">
               <input class="form-control" type = "text" placeholder="Area" id="areaInput" autoFocus>
            </div>


            <div class="col-sm-3">
               <input class="form-control" type = "text" placeholder="Title" id="titleInput" autoFocus>
            </div>


         </div>
         <br>
      </div>

      <div id="queryResults" class="container-fluid"></div>


   <div class="container-fluid" style="background-color:#295078; color:white">
      <center>Created by Sean Wang and Alina Chen</center>
    </div>


<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
<script>
   'use strict';
   function handleResponse(response)
   {
      $('#queryResults').html(response)
   }

   function getResults()
   {
      let dept = $('#deptInput').val();
      let coursenum = $('#numInput').val();
      let area = $('#areaInput').val();
      let title = $('#titleInput').val();

      dept = encodeURIComponent(dept)
      coursenum = encodeURIComponent(coursenum)
      area = encodeURIComponent(area)
      title = encodeURIComponent(title)

      let url = '/reg?dept=' + dept + '&coursenum=' + coursenum
      + '&area=' + area + '&title=' + title

      if (request != null)
         request.abort();

      request = $.ajax(
         {
            type: 'GET',
            url: url,
            success: handleResponse
         }
      );
   }

   let request = null;
   function setup()
   {
      $('#deptInput').on('input', getResults);
      $('#numInput').on('input', getResults);
      $('#areaInput').on('input', getResults);
      $('#titleInput').on('input', getResults);
      getResults();
   }
   $('document').ready(getResults());
   $('document').ready(setup);
</script>
   </body>

 </html>
